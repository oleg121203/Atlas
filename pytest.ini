[pytest]
# Pytest configuration file
# This file complements the configuration in pyproject.toml

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ui: marks tests related to UI components
    api: marks tests related to API calls
    performance: marks tests related to performance benchmarking
    macos: marks tests specific to macOS platform

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:matplotlib.*
    ignore::UserWarning:PySide6.*

# Asyncio
asyncio_mode = auto

# Minimum versions
minversion = 6.0
