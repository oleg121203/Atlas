[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "atlas-ai-assistant"
version = "1.0.0"
description = "Atlas Universal AI Assistant with Advanced Analytics"
authors = [{ name = "Atlas Development Team", email = "dev@atlas-ai.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.13"
dependencies = [
    # Base dependencies needed for the core application
    # Compatible with Python 3.9
    "PySide6>=6.5.0,<7.0.0",
    "darkdetect>=0.8.0",
    "qdarkstyle>=3.1.0",

    # AI and ML
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "langchain>=0.0.267",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "chromadb>=0.4.18",
    "sentence-transformers>=2.2.2",
    "nltk>=3.8.0",

    # Data Processing
    "pandas>=1.5.3,<2.0.0",
    "matplotlib>=3.7.2",
    "numpy>=1.24.3",
    "scikit-learn>=1.3.0",
    "Pillow>=9.5.0",
    "seaborn>=0.12.2",

    # Essential Utilities
    "requests>=2.31.0",
    "pydantic>=1.10.8,<2.0.0",
    "python-dotenv>=1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
keywords = ["ai", "assistant", "automation", "analytics", "pyside6"]

[project.urls]
Homepage = "https://github.com/atlas-ai/atlas"
Documentation = "https://atlas-ai.readthedocs.io"
Repository = "https://github.com/atlas-ai/atlas"
"Bug Tracker" = "https://github.com/atlas-ai/atlas/issues"

[project.scripts]
atlas = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<7.4.0",           # Версія для Python 3.9
    "pytest-cov>=4.0.0,<4.1.0",       # Версія для Python 3.9
    "pytest-asyncio>=0.18.0,<0.21.0", # Версія для Python 3.9
    "pytest-mock>=3.10.0,<3.11.0",    # Версія для Python 3.9
    "pytest-xdist>=3.0.0,<3.3.0",     # Версія для Python 3.9
    "ruff>=0.0.262,<0.1.0",           # Остання версія для Python 3.9
    "mypy>=1.0.0,<1.5.0",             # Версія для Python 3.9
    "pre-commit>=3.2.0,<3.4.0",       # Версія для Python 3.9
    "bandit>=1.7.4,<1.7.5",           # Версія для Python 3.9
    "safety>=2.2.0,<2.3.0",           # Версія для Python 3.9
    "types-requests",
    "types-urllib3",
    "types-setuptools",
    "types-pyyaml",
    "black>=23.0.0,<23.1.0",          # Версія для Python 3.9
    "isort>=5.12.0,<5.13.0",          # Версія для Python 3.9
]

workflow = [
    "networkx>=2.6.3,<3.0",     # Остання версія, сумісна з Python 3.9
    "pydantic>=1.10.8,<2.0.0",  # Остання v1 версія для Python 3.9
    "graphviz>=0.19.1,<0.20.0", # Версія для Python 3.9
]

monitoring = [
    "psutil>=5.9.0,<5.9.8",                                        # Версія, сумісна з Python 3.9
    "pyuserinput>=0.1.11",
    "python-xlib>=0.31,<0.33",                                     # Версія для Python 3.9
    "pyobjc-framework-Quartz>=8.5,<9.0; sys_platform == 'darwin'", # Для Python 3.9
    "pyobjc-framework-AppKit>=8.5,<9.0; sys_platform == 'darwin'", # Для Python 3.9
    "pywin32>=303,<306; sys_platform == 'win32'",                  # Версія для Python 3.9
]

intelligence = [
    # Оновлено версії для сумісності з Python 3.9
    "numpy>=1.24.3,<1.26.0",        # Остання версія для Python 3.9
    "scikit-learn>=1.0.2,<1.4.0",   # Сумісна з Python 3.9
    "transformers>=4.25.0,<4.30.0", # Сумісна з Python 3.9
    "torch>=1.13.1,<2.0.0",         # Остання 1.x версія для Python 3.9
    "faiss-cpu>=1.7.2,<1.7.4",      # Сумісна з Python 3.9
]
docs = [
    "sphinx>=6.0.0,<7.0.0",                     # Версія, сумісна з Python 3.9
    "sphinx-rtd-theme>=1.2.0,<1.3.0",           # Версія для Python 3.9
    "myst-parser>=1.0.0,<2.0.0",                # Версія для Python 3.9
    "sphinx-autodoc-typehints>=1.19.0,<1.24.0", # Для Python 3.9
    "sphinx-copybutton>=0.5.0",
]
performance = [
    "memory-profiler>=0.60.0,<0.61.0", # Версія для Python 3.9
    "line-profiler>=3.5.1,<4.0.0",     # Версія для Python 3.9
    "py-spy>=0.3.12,<0.3.14",          # Версія для Python 3.9
]

# AI and ML
# Latest versions compatible with Python 3.9

# Data Processing
# Last versions compatible with Python 3.9

# Essential Utilities

[tool.ruff]
# Вказуємо цільову версію Python
target-version = "py39"

# Шляхи до коду для аналізу
src = [
    ".",
    "src",
    "core",
    "ui",
    "tools",
    "workflow",
    "intelligence",
    "utils",
    "plugins",
]

# Виключення непотрібних директорій
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "backup_archive",
    "backup_ui",
    "backup_ui_qt",
    "htmlcov",
    "docs/_build",
]

# Base Ruff configuration
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "S", "C4", "PTH", "RUF", "TID", "PL"]
ignore = ["E501", "S101", "C901"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.bandit]
# Configuration for bandit security linter
exclude_dirs = ["backup_archive", "backup_ui", "backup_ui_qt", "tests", ".venv"]
skips = [
    "B101",
    "B601",
    "B602",
    "B603",
] # Skip assert statements and subprocess calls in testing

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py", "**/tests/**"]

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:networkx.*:",
    "ignore::DeprecationWarning:pkg_resources.*:",
    "ignore::FutureWarning:torch.*:",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=core",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: mark a test as an asyncio test",
    "quality: mark tests related to quality assurance",
    "ui: mark tests related to UI components",
    "api: mark tests related to API calls",
    "performance: mark tests related to performance benchmarking",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["core", "tests"]
omit = ["*/__init__.py", "tests/*_test.py"]

[tool.coverage.report]
skip_empty = true
fail_under = 75.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
    "except ModuleNotFoundError:",
    "if TYPE_CHECKING:",
]
ignore_errors = true
show_missing = true
precision = 2
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"
