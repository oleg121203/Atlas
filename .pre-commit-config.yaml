repos:
  # 🧹 General file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: mixed-line-ending

  # 🐍 Python code quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  #  Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        name: "🔒 Security Scan"
        args: [--recursive, --format, json, --output, bandit-report.json, --severity-level, medium, --exit-zero]
        files: ^atlas/.*\.py$
        description: "Security scan для atlas/ пакету"

  # 🏗️ Atlas project structure check
  - repo: local
    hooks:
      - id: atlas-structure-check
        name: "🔍 Atlas Structure & Duplicate Check"
        entry: python scripts/check_structure.py
        language: system
        files: ^(atlas/|scripts/|config/|tests/|pyproject\.toml)
        pass_filenames: false
        verbose: true
        description: "Перевіряє структуру проєкту та дублікати файлів"

  # 🧪 Testing
  - repo: local
    hooks:
      - id: pytest-check
        name: "🧪 Run Tests"
        entry: python -m pytest tests/ -v --tb=short --maxfail=5
        language: system
        pass_filenames: false
        always_run: true
        description: "Запуск тестів для перевірки функціональності"

  # 📋 Update documentation if needed
  - repo: local
    hooks:
      - id: update-docs
        name: "📋 Update Documentation"
        entry: python scripts/update_docs.py
        language: system
        pass_filenames: false
        files: '^(atlas/|DEV_PLAN\.md|CHANGELOG\.md)'
        description: "Оновлення документації при змінах"
