name: 🏗️ Atlas Quality Control & Structure Check

on:
  push:
    branches: [ main, refactor/project-structure ]
  pull_request:
    branches: [ main ]

jobs:
  structure-check:
    name: 📋 Project Structure Validation
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔍 Run Atlas structure check
      run: |
        echo "🔍 Running comprehensive Atlas structure and duplicate check..."
        python scripts/check_structure.py --report=json --output=structure-report.json

    - name: 📊 Upload structure report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: atlas-structure-report
        path: structure-report.json

    - name: 🚨 Check for critical structure issues
      run: |
        if [ -f structure-report.json ]; then
          echo "📋 Structure check completed. Checking for critical errors..."
          # Extract error count from JSON report
          error_count=$(python -c "
          import json
          try:
              with open('structure-report.json', 'r') as f:
                  data = json.load(f)
              errors = len([i for i in data.get('issues', []) if i.get('severity') == 'error'])
              print(errors)
          except:
              print(0)
          ")
          echo "Found $error_count critical errors"
          if [ "$error_count" -gt 5 ]; then
            echo "❌ Too many critical structure errors found!"
            exit 1
          fi
        fi

    - name: 📄 Upload structure report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: atlas-structure-report
        path: atlas-structure-report.json

  code-quality:
    name: 🧹 Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy bandit
        pip install -r requirements.txt

    - name: 🔧 Run Ruff linting
      run: ruff check atlas/ --output-format=github

    - name: 🎨 Check Ruff formatting
      run: ruff format atlas/ --check

    - name: 🔍 Run type checking with MyPy
      run: mypy atlas/ --install-types --non-interactive || true

    - name: 🔒 Run security scan with Bandit
      run: bandit -r atlas/ -f json -o bandit-report.json
      continue-on-error: true

    - name: 📄 Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: bandit-report.json

  tests:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 🧪 Run tests with coverage
      run: |
        python -m pytest tests/ --cov=atlas --cov-report=xml --cov-report=term

    - name: 📊 Upload coverage to Codecov
      if: matrix.python-version == '3.9'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-check:
    name: 🚀 Build & Import Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 Install in development mode
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: ✅ Test atlas package import
      run: |
        python -c "import atlas; print('✅ Atlas package imported successfully')"
        python -c "from atlas.core.application import AtlasApplication; print('✅ Core components accessible')"
        python -c "from atlas.ui.main_window import MainWindow; print('✅ UI components accessible')"

    - name: 🏃 Test atlas main execution (dry run)
      run: |
        python -m atlas.main --help || echo "✅ Atlas main module can be executed"

  documentation:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🔍 Check DEV_PLAN and CHANGELOG sync
      run: |
        grep -q "CHANGELOG.md" DEV_PLAN.md && echo "✅ DEV_PLAN references CHANGELOG" || echo "❌ Missing CHANGELOG reference"
        grep -q "v2.0.0" CHANGELOG.md && echo "✅ CHANGELOG has version info" || echo "❌ Missing version info"

    - name: 📋 Validate Markdown files
      uses: nosborn/github-action-markdown-cli@v3.2.0
      with:
        files: '*.md'
        config_file: '.markdownlint.json'
        ignore_files: '.github/'

  notification:
    name: 📢 Quality Report Summary
    runs-on: ubuntu-latest
    needs: [structure-check, code-quality, tests, build-check]
    if: always()

    steps:
    - name: 📊 Generate summary
      run: |
        echo "## 🏗️ Atlas Quality Control Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Structure Check | ${{ needs.structure-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Check | ${{ needs.build-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
