name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0" # Run weekly on Sunday at midnight

jobs:
  security_scan:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit gitleaks-scanner mypy ruff

      - name: Run Safety check for dependency vulnerabilities
        run: safety check --full-report --output json --output-file safety-report-macos.json
        continue-on-error: true

      - name: Run Bandit for security issues in Python code
        run: |
          echo "🍎 Running macOS security scan..."
          bandit -r . -c pyproject.toml -f json -o bandit-report-macos.json
          fi
        continue-on-error: true

      - name: Run platform-specific checks
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            echo "🐧 Running Linux-specific security checks..."
            # Add Linux-specific security checks here
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "🍎 Running macOS-specific security checks..."
            # Add macOS-specific security checks here
          fi
        continue-on-error: true

      - name: Run Ruff for linting
        run: ruff check .
        continue-on-error: true

      - name: Run mypy for type checking
        run: mypy .
        continue-on-error: true

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-results-${{ matrix.os }}
          path: |
            safety-report-${{ matrix.os }}.json
            bandit-report-*.json
