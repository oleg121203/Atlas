name: Automated Deployment

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for deployment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build paramiko boto3

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/tags/v*" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            echo "🐧 Building Linux package..."
            python -m build --wheel
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "🍎 Building macOS application bundle..."
            ./scripts/build_macos_app.sh
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: atlas-${{ matrix.os }}-build
          path: |
            dist/
            *.app/
            *.dmg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/tags/v*" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v3

      - name: Run deployment script
        env:
          ATLAS_ENCRYPTION_KEY: ${{ secrets.ATLAS_ENCRYPTION_KEY }}
          ATLAS_MASTER_KEY: ${{ secrets.ATLAS_MASTER_KEY }}
        run: |
          pip install paramiko boto3
          python scripts/deploy.py --environment ${{ steps.env.outputs.environment }} --log-level DEBUG

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text": "Deployment to ${{ steps.env.outputs.environment }} failed. Check GitHub Actions for details."}' ${{ secrets.SLACK_WEBHOOK_URL }}
          fi

      - name: Notify on success
        if: success()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' --data '{"text": "Deployment to ${{ steps.env.outputs.environment }} completed successfully."}' ${{ secrets.SLACK_WEBHOOK_URL }}
          fi
